services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: fastsocial
      POSTGRES_USER: fastsocial
      POSTGRES_PASSWORD: fastsocial
    ports:
      - "5438:5432"
    volumes:
      - fastsocial_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fastsocial -d fastsocial"]
      interval: 3s
      timeout: 3s
      retries: 20

  app:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://fastsocial:fastsocial@db:5432/fastsocial
    ports:
      - "5062:5062"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - fastsocial_media:/app/data/media

volumes:
  fastsocial_pg:
  fastsocial_media:

