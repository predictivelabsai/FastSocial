[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fastsocial"
version = "0.1.0"
description = "Personal-first, team-ready social media scheduling and analytics"
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.14",
  "apscheduler>=3.11",
  "authlib>=1.4",
  "bcrypt>=4.2",
  "boto3>=1.35",
  "cryptography>=44",
  "httpx>=0.28",
  "openai>=1.60",
  "pillow>=11",
  "psycopg[binary]>=3.2",
  "pydantic-settings>=2.7",
  "python-fasthtml>=0.12",
  "python-multipart>=0.0.20",
  "sqlalchemy>=2.0.36",
  "uvicorn[standard]>=0.34",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-cov>=6",
  "ruff>=0.9",
]

[tool.hatch.build.targets.wheel]
packages = ["fastsocial"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "UP042"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
